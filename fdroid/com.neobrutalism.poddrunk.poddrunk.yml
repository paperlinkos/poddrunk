Categories:
  - Local Media Player
License: MIT
AuthorName: Poddrunk Contributors
SourceCode: https://github.com/paperlinkos/poddrunk
IssueTracker: https://github.com/paperlinkos/poddrunk/issues
Changelog: https://github.com/paperlinkos/poddrunk/releases

AutoName: Poddrunk

RepoType: git
Repo: https://github.com/paperlinkos/poddrunk.git

Builds:
  - versionName: 1.1.4
    versionCode: 61
    commit: a9065085725c089a1918b9a186c220204cf18c3f
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - find .pub-cache -name "AndroidManifest.xml" -exec sed -i -E 's/package="[^"]*"//g'
        {} +
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi
        --target-platform="android-arm"

