
<!DOCTYPE html>
<html>
<head>
<style>

  :root {
    --primary: #F7CE46;
    --accent: #EE5A24;
    --border: #111111;
    --canvas: #F9F4EB;
    --card-bg: #FFFFFF;
    --text: #111111;
    --muted: #666666;
    --shadow-color: #111111;
  }


  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  
  body {
    width: 390px;
    height: 844px;
    background: var(--canvas);
    color: var(--text);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Status Bar */
  .status-bar {
    height: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 28px 0 28px;
    font-size: 13px;
    font-weight: 800;
    color: var(--text);
    z-index: 100;
    flex-shrink: 0;
  }
  .dynamic-island {
    width: 110px;
    height: 28px;
    background: #000;
    border-radius: 20px;
    position: absolute;
    top: 10px;
    left: calc(50% - 55px);
  }

  .content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 8px 16px 20px 16px;
    position: relative;
    overflow: hidden;
  }

  .brutalist-card {
    background: var(--card-bg);
    border: 2px solid var(--border);
    box-shadow: 3.5px 3.5px 0 var(--shadow-color);
    border-radius: 6px;
    padding: 12px;
  }

  .btn {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 900;
    border: 2px solid var(--border);
    box-shadow: 3px 3px 0 var(--shadow-color);
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-primary { background: var(--primary); color: #111; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-card { background: var(--card-bg); color: var(--text); }

.splash-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #F9F4EB;
}
.logo-box {
  width: 160px;
  height: 160px;
  background: #F7CE46;
  border: 3.5px solid #111111;
  box-shadow: 6px 6px 0 #111111;
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.logo-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>
